name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Android SDK unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest ships the Android SDK (compileSdk 34
      # preinstalled, licenses pre-accepted) and exposes it via $ANDROID_HOME, which
      # Gradle uses. This avoids android-actions/setup-android@v4's broken cmdline-tools
      # license step and drops a supply-chain dependency.
      - name: Run androidsdk unit tests
        run: ./gradlew :androidsdk:testDebugUnitTest
